openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Live TMDB catalog operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/home:
    get:
      operationId: getCatalogHome
      tags: [catalog]
      summary: Get popular and trending titles
      responses:
        "200":
          description: Live catalog rails
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHome"
  /catalog/title/{id}:
    get:
      operationId: getCatalogTitle
      tags: [catalog]
      summary: Get title details, cast, artwork, and stills
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [movie, tv]
      responses:
        "200":
          description: Title details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Title"
        "404":
          description: Title not found
  /catalog/discover:
    get:
      operationId: discoverCatalog
      tags: [catalog]
      summary: Browse paginated movies or series
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [movie, tv]
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 1
      responses:
        "200":
          description: A page of catalog titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "400":
          description: Invalid catalog browse parameters
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Title:
      type: object
      properties:
        id:
          type: integer
        mediaType:
          type: string
          enum: [movie, tv]
        title:
          type: string
        originalTitle:
          type: string
        overview:
          type: string
        releaseDate:
          type: string
        year:
          type: string
        genres:
          type: array
          items:
            type: string
        cast:
          type: array
          items:
            type: string
        posterUrl:
          type: string
        backdropUrl:
          type: string
        stillUrls:
          type: array
          items:
            type: string
        rating:
          type: number
        runtimeMinutes:
          type: integer
        seasons:
          type: integer
        seasonsData:
          type: array
          items:
            $ref: "#/components/schemas/Season"
        imdbId:
          type: string
      required:
        - id
        - mediaType
        - title
        - originalTitle
        - overview
        - releaseDate
        - year
        - genres
        - cast
        - posterUrl
        - backdropUrl
        - stillUrls
        - rating
        - runtimeMinutes
        - seasons
        - seasonsData
        - imdbId
    Episode:
      type: object
      properties:
        episodeNumber:
          type: integer
        title:
          type: string
        overview:
          type: string
        airDate:
          type: string
        runtimeMinutes:
          type: integer
        stillUrl:
          type: string
      required:
        - episodeNumber
        - title
        - overview
        - airDate
        - runtimeMinutes
        - stillUrl
    Season:
      type: object
      properties:
        seasonNumber:
          type: integer
        name:
          type: string
        overview:
          type: string
        episodeCount:
          type: integer
        airDate:
          type: string
        posterUrl:
          type: string
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/Episode"
      required:
        - seasonNumber
        - name
        - overview
        - episodeCount
        - airDate
        - posterUrl
        - episodes
    CatalogRail:
      type: object
      properties:
        title:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/Title"
      required:
        - title
        - items
    CatalogHome:
      type: object
      properties:
        featured:
          $ref: "#/components/schemas/Title"
        rails:
          type: array
          items:
            $ref: "#/components/schemas/CatalogRail"
        syncedAt:
          type: string
      required:
        - featured
        - rails
        - syncedAt
    CatalogPage:
      type: object
      properties:
        page:
          type: integer
        totalPages:
          type: integer
        totalResults:
          type: integer
        mediaType:
          type: string
          enum: [movie, tv]
        items:
          type: array
          items:
            $ref: "#/components/schemas/Title"
      required:
        - page
        - totalPages
        - totalResults
        - mediaType
        - items

